# 只负责一件事：electron-builder 的 Windows 安装包（NSIS）打包配置。

appId: com.snowwind.novel-agent
productName: 雪风小说工坊

directories:
  output: 99 构建产物/发布

# 只把跑起来真正需要的三样塞进 app.asar：主进程、预加载、界面产物。
# 不写死 99 构建产物/**，否则 dist 里的截图、自检脚本会被一起打进去，白胖几十兆。
# dependencies（react/react-dom）由 electron-builder 自动带上，devDependencies 一个不带。
files:
  - package.json
  - 99 构建产物/main.cjs
  - 99 构建产物/preload.cjs
  - 99 构建产物/renderer/**

asar: true

# 自动更新源：generic（静态服务器 / 对象存储都行）。发布时把 exe + blockmap + latest.yml
# 一起传到这个目录，electron-updater 就会照 latest.yml 比对版本。地址改了只动这一行。
publish:
  provider: generic
  url: https://example.com/xuefeng/updates
  channel: latest

# 直接用 node_modules 里已装好的 electron，不再从网上下 115 MB 的 zip；离线也能打包。
electronDist: node_modules/electron/dist

# 源 package.json 里没有 author，NSIS 的版本信息需要它；只改包内的元数据，不动仓库里的文件。
extraMetadata:
  main: 99 构建产物/main.cjs
  author: 雪风

win:
  # 不签名，也不改写 exe 内部的图标与版本资源：都靠 rcedit，而 rcedit 来自 winCodeSign 包，
  # 那包里带 macOS 符号链接，Windows 没开「开发者模式」时解不开。
  signAndEditExecutable: false
  # 产出安装包（双击安装、开始菜单与桌面快捷方式），不再出便携版。
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 雪风小说工坊
  artifactName: 雪风小说工坊-${version}-安装版.${ext}
  deleteAppDataOnUninstall: false
